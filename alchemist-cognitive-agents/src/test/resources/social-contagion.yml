incarnation: protelis

_danger: &danger
  danger
_target: &target
  target

environment:
  type: ContinuousPhysics2DEnvironment

layers:
  - type: StepLayer
    molecule: *danger
    parameters: [0, 0, 100.0, 0.0]
  - type: BidimensionalGaussianLayer
    molecule: *target
    parameters: [-50, 0, 10, 50]

seeds:
  scenario: 0
  simulation: 1

_cognitive_behavior: &cognitive_behavior
  time-distribution:
    type: DiracComb
    parameters: [0.5]
  type: CognitiveBehavior

_pedestrian: &pedestrian
  properties:
    - type: Human
      parameters: ["adult", "male"]
    - type: CognitivePedestrian
    - type: Cognitive2D
      parameters: [ *danger ]
    - type: Perceptive2D
    - type: CircularArea

deployments:
  # This pedestrian is directly exposed and remains still, acting as the source of social contagion.
  - type: Point
    parameters: [1, 1]
    <<: *pedestrian
    programs:
      - *cognitive_behavior
  # This pedestrian starts in the zero-valued half-plane and can evacuate only after social contagion.
  - type: Point
    parameters: [1, -1]
    <<: *pedestrian
    programs:
      - *cognitive_behavior
      - time-distribution:
          type: DiracComb
          parameters: [2.0]
        type: BlendedSteering
        actions:
          - type: CognitiveAgentFollowLayer
            parameters: [*target]
        conditions:
          - type: WantToEscape
