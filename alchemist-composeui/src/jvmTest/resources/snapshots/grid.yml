# A plain 2D grid computing a gradient from the bottom left corner, for UI snapshots.
incarnation: protelis

seeds:
  scenario: 0
  simulation: 0

network-model:
  type: ConnectWithinDistance
  parameters: [0.8]

_gradient: &gradient
  - time-distribution: 1
    program: |
      import java.lang.Double.POSITIVE_INFINITY
      let source = env.has("source") && env.get("source");
      let distance = rep (d <- POSITIVE_INFINITY) {
        mux (source) { 0 } else { minHood(nbr(d) + self.nbrRange()) }
      };
      env.put("distance", distance);
      distance
  - program: send

deployments:
  type: Grid
  parameters: [-5, -5, 5, 5, 0.5, 0.5]
  contents:
    - molecule: source
      concentration: false
    - in: { type: Rectangle, parameters: [-5.3, -5.3, 0.6, 0.6] }
      molecule: source
      concentration: true
  programs: *gradient
