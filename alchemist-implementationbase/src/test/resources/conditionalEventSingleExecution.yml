incarnation: protelis

network-model:
  type: ConnectWithinDistance
  parameters: [30]

deployments:
  - type: Rectangle
    parameters: [100, 62, 15, 95, 200]
    programs:
      - type: ConditionalEvent
        time-distribution: 1
        actions:
          - type: TestEventAction
            parameters: []

terminate:
  - type: AfterTime
    parameters: 2
