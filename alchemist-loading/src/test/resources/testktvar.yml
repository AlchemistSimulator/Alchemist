variables:
  a:
    formula: 22 + 1
    language: kts
  test:
    formula: |
      import it.unibo.alchemist.boundary.Loader
      import kotlin.collections.listOf
      val b = 5.5
      listOf(bindings["a"], b)
    language: kotlin
  test2:
    formula: |
      val b = 5.5
      listOf("a", b)
    language: kotlin
  test3:
    formula: test + test2
  # The runtime classes of these values are not accessible from scripts
  list:
    formula: listOf(1, 2)
    language: kotlin
  singletonList:
    formula: listOf(3)
    language: kotlin
  emptyList:
    formula: emptyList<Int>()
    language: kotlin
  set:
    formula: setOf(4)
    language: kotlin
  emptySet:
    formula: emptySet<Int>()
    language: kotlin
  map:
    formula: mapOf("five" to 5)
    language: kotlin
  emptyMap:
    formula: emptyMap<String, Int>()
    language: kotlin
  entry:
    formula: mapOf("six" to 6, "seven" to 7).entries.first()
    language: kotlin
  # References all the collections above
  collectionSizes:
    formula: list.size + singletonList.size + emptyList.size + set.size + emptySet.size + map.size + emptyMap.size + entry.value as Int
    language: kotlin
  # Evaluated with all the collections above as bindings, without referencing them
  afterCollections:
    formula: collectionSizes * 2
    language: kotlin
  # The runtime class of this value is accessible, and must be preserved
  sortedMap:
    formula: java.util.TreeMap(mapOf("b" to 2, "a" to 1))
    language: kotlin
  firstKey:
    formula: sortedMap.firstKey()
    language: kotlin
incarnation: sapere
