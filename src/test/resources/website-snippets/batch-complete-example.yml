incarnation: sapere

variables:
  nodeCount: &nodeCount
    type: LinearVariable
    parameters: [10, 5, 15, 5]  # Default: 10, Min: 5, Max: 15, Step: 5
  range: &range
    type: LinearVariable
    parameters: [2, 1, 3, 1]    # Default: 2, Min: 1, Max: 3, Step: 1

# Configure launcher for batch execution
launcher:
  parameters:
    batch: [nodeCount, range]

network-model:
  type: ConnectWithinDistance
  parameters: [*range]

deployments:
  - type: Circle
    parameters: [*nodeCount, 0, 0, 5]
    contents:
      - molecule: source
        concentration: true
    programs:
      - time-distribution: 1
        program: >
          {source} --> {processed}

export:
  - type: CSVExporter
    parameters:
      fileNameRoot: "batch_results"
      interval: 1.0
    data:
      - time

terminate:
  - type: AfterTime
    parameters: 5